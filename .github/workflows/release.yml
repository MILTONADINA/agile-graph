name: Release

# Publishes @agile-graph/contracts and @agile-graph/engine to npm
# when the owner pushes a version tag. npm trusted publishing (OpenID Connect)
# authenticates the job, so no npm token is stored, and npm records
# provenance for each package. Required reviewers on the npm environment gate
# every publish; see docs/publishing.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only a commit that reached main through a reviewed, green PR is
      # released, whoever pushed the tag.
      - name: The tag points at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.16.0
      - name: Install dependencies with one bounded retry
        run: |
          # The root postinstall native archive fetch is outside npm's retry.
          npm ci || { sleep 5; npm ci; }
      - run: npm run build
      - name: Tag, package metadata and tarball contents
        run: node --test scripts/npm-packages.test.mjs
        env:
          GRAPH_ENGINE_RELEASE_TAG: ${{ github.ref_name }}
      - name: Install the packed tarballs and run the CLI
        run: node scripts/npm-smoke.mjs
      - name: Generate CycloneDX SBOMs
        run: |
          mkdir sbom
          for workspace in packages/contracts packages/engine; do
            name=$(node -p "require('./$workspace/package.json').name")
            npm sbom --workspace "$workspace" --sbom-format cyclonedx --omit dev > "sbom/${name#@agile-graph/}.cdx.json"
          done
      - name: Upload the SBOMs next to the provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom/*.cdx.json
          if-no-files-found: error
      - name: Publish contracts, then the engine that depends on it
        run: |
          for workspace in packages/contracts packages/engine; do
            name=$(node -p "require('./$workspace/package.json').name")
            version=$(node -p "require('./$workspace/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish --workspace "$workspace" --access public
            fi
          done
