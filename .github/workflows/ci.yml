name: Platform checks

on:
  pull_request:
    branches: [main, dev, "feat/**", "fix/**", "chore/**"]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    # Linux x64 also runs the serial Docker/native/browser integration suites.
    # Keep a bounded job budget without cutting off final browser provisioning.
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 45 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: runner.os != 'Linux' || runner.arch != 'X64'
      - name: Install Linux x64 dependencies with one bounded retry
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          # onnxruntime-node fetches a native archive in postinstall, outside npm's fetch retry.
          npm ci || { sleep 5; npm ci; }
      - run: npm run format:check
      - run: npm run lint
      - name: Git branch and push safety
        run: node --test scripts/git-safety.test.mjs
      - name: Cursor private-context exclusions
        run: node --test scripts/cursor-ignore.test.mjs
      - name: Current synthetic fixture receipt
        run: node --test evaluation/validate-fixtures.test.mjs
      - run: npm run check
      - name: Feature specs link real tests
        run: node packages/engine/dist/cli.js spec-check
      - name: Built engine refuses a stale dist for cloud MCP
        # After npm run check, which builds the engine only after its tests.
        run: node --test scripts/dist-freshness.test.mjs
      - name: Branch-protection policy
        run: node --test scripts/branch-protection.test.mjs
      - name: Promotion key helper (temporary key directories only)
        run: node --test scripts/promotion-key.test.mjs
      - name: Local wrapper strips Jev credentials (temporary directories only)
        run: node --test scripts/local-engine-env.test.mjs
      - name: Labelling and paired-run collection (synthetic fixtures only)
        run: node --test scripts/labelling.test.mjs
      - name: npm packages and the installed CLI
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          node --test scripts/npm-packages.test.mjs
          node scripts/npm-smoke.mjs
      - name: Evaluation protocol and intake checks
        run: node --test evaluation/candidate-cases.test.mjs evaluation/candidate-mount.test.mjs evaluation/native-mount.test.mjs evaluation/isolated-candidate.test.mjs evaluation/calibration-corpus.test.mjs evaluation/corpus-history.test.mjs evaluation/historical-receipt-pins.test.mjs evaluation/candidate-retry-visibility.test.mjs evaluation/verify-retry-visibility.test.mjs evaluation/candidate-cloud-graph.test.mjs evaluation/candidate-verifier-infrastructure.test.mjs evaluation/candidate-verifier-setup.test.mjs evaluation/verify-verifier-infrastructure.test.mjs
      - name: Paired local context packet checks (no model call)
        run: node --test evaluation/live-paired-qwen-context.test.mjs
      - name: Sealed collection bookkeeping
        run: node --test evaluation/sealed/tests/*.test.mjs
      - name: Docker execution integration
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker pull node:24-alpine
          npm test -w @agile-graph/engine -- --run tests/execution.test.ts tests/generator.test.ts
        env:
          GRAPH_ENGINE_DOCKER_TESTS: "1"
      - name: Evaluation fixture self-checks
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          node --test evaluation/runner.test.mjs evaluation/validate-historical-corpus.test.mjs
          node evaluation/calibration-corpus.mjs validate
        env:
          GRAPH_ENGINE_HISTORY_TESTS: "1"
      - name: Isolated generated-candidate verification
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker build -f evaluation/guest-runtime/Dockerfile -t graph-evaluation-guest:local evaluation/guest-runtime
          node --test --test-concurrency=1 evaluation/guest-runtime/integration.test.mjs evaluation/guest-runtime/cloud-graph.test.mjs evaluation/isolated-candidate.test.mjs
        env:
          GRAPH_ENGINE_GUEST_RUNTIME_TESTS: "1"
          GRAPH_ENGINE_GUEST_HISTORY_TESTS: "1"
          GRAPH_ENGINE_CANDIDATE_DOCKER_TESTS: "1"
      - name: Native Linux historical private-mount permissions
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: node --test evaluation/native-mount.test.mjs
        env:
          GRAPH_ENGINE_NATIVE_MOUNT_TESTS: "1"
      - name: Snapshot-only Go compiler bindings
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker pull golang@sha256:d2d2bc1c84f7e60d7d2438a3836ae7d0c847f4888464e7ec9ba3a1339a1ee804
          npm run verify:image
          npm test -w @agile-graph/engine -- --run tests/context-go.test.ts
          docker build --pull=false --network=none -f packages/engine/tests/fixtures/go-runtime/Dockerfile -t graph-go-native-test:local .
          docker run --rm --network=none --read-only --tmpfs /tmp:rw,exec,nosuid,size=768m --memory=1536m --cpus=2 --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges graph-go-native-test:local
        env:
          GRAPH_ENGINE_GO_DOCKER_TESTS: "1"
      - name: Snapshot-only Java compiler bindings
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker pull eclipse-temurin@sha256:92a2a4d7a928d057e7bd999c418d66c26a34eb9a0442f3ab67721c3f88110b2d
          docker build --pull=false --network=none -f packages/engine/tests/fixtures/java-runtime/Dockerfile -t graph-java-native-test:local .
          docker run --rm --network=none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m --memory=1g --cpus=2 --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges graph-java-native-test:local
      - name: Snapshot-only C# compiler bindings
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker pull mcr.microsoft.com/dotnet/sdk@sha256:78235e09001f52b6592c458ac010775ebac6725422e80cd0c1650590f67b2743
          npm test -w @agile-graph/engine -- --run tests/context-csharp.test.ts
          docker build --pull=false --network=none -f packages/engine/tests/fixtures/csharp-runtime/Dockerfile -t graph-csharp-native-test:local .
          docker run --rm --network=none --read-only --tmpfs /tmp:rw,exec,nosuid,size=768m --memory=1536m --cpus=2 --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges graph-csharp-native-test:local
        env:
          GRAPH_ENGINE_CSHARP_DOCKER_TESTS: "1"
      - name: Snapshot-only Rust declaration bindings
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          RUST_FIXTURE_TOOLS=$(mktemp -d)
          node packages/engine/tests/fixtures/rust-runtime/provision.mjs x64 "$RUST_FIXTURE_TOOLS"
          docker buildx build --load --pull=false --network=none --build-context rust_tool="$RUST_FIXTURE_TOOLS" -f packages/engine/tests/fixtures/rust-runtime/Dockerfile -t graph-rust-native-test:local .
          docker run --rm --network=none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m --memory=1g --cpus=2 --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges graph-rust-native-test:local
      - name: Snapshot-only Dart analyzer bindings
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker pull dart@sha256:4027705fb598ee07b016e17a06786e56c399f95308a54f7171fcc60871eb1738
          docker buildx build --platform=linux/amd64 --load --pull=false --network=none -f packages/engine/tests/fixtures/dart-runtime/Dockerfile -t graph-dart-analyzer:local packages/engine/tests/fixtures/dart-runtime
          docker image inspect graph-dart-analyzer:local --format 'Dart image={{.Id}} os={{.Os}} arch={{.Architecture}} env={{json .Config.Env}} entrypoint={{json .Config.Entrypoint}} labels={{json .Config.Labels}}'
          npm test -w @agile-graph/engine -- --run tests/context-dart-runtime.test.ts
        env:
          GRAPH_ENGINE_DART_DOCKER_TESTS: "1"
      - name: Platform dashboard browser integration
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:fixture -w @agile-graph/dashboard
      # Node 22 compatibility run, last on purpose: every Node 24 step and the
      # built dist/ are done, and node_modules from npm ci is reused. It pins
      # the supported floor (engines >=22.12).
      - name: Switch to Node 22.12 (compatibility run)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
      - name: Contracts and engine tests on Node 22.12
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          node --version
          npm test -w @agile-graph/contracts
          npm test -w @agile-graph/engine

  sidecar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s sidecars/laya -p 'test_*.py' -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies with one bounded retry
        run: |
          # The root postinstall native archive fetch is outside npm's retry.
          npm ci || { sleep 5; npm ci; }
      - name: Build the pinned security scanner image with one bounded retry
        run: |
          # The build fetches pinned artifacts from several hosts.
          docker build -t graph-security:local sidecars/security || { sleep 30; docker build -t graph-security:local sidecars/security; }
      - name: Real scanners find, suppress and fingerprint findings
        run: |
          npm run build:dependencies
          npm test -w @agile-graph/engine -- tests/security-catalog.test.ts tests/security-live.test.ts
        env:
          GRAPH_ENGINE_SECURITY_IMAGE: "1"
          GRAPH_ENGINE_LIVE_SCAN_TESTS: "1"

  historical-replays:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install historical replay dependencies with one bounded retry
        run: |
          # The root postinstall native archive fetch is outside npm's retry.
          npm ci || { sleep 5; npm ci; }
      - name: Historical retry-state replay
        run: |
          node evaluation/retry-visibility-runtime/provision.mjs
          node --test evaluation/candidate-retry-visibility.test.mjs evaluation/verify-retry-visibility.test.mjs
        env:
          GRAPH_ENGINE_RETRY_DOCKER_TESTS: "1"
      - name: Historical verifier-infrastructure replay
        run: |
          node evaluation/infrastructure-runtime/provision.mjs
          node --test evaluation/candidate-verifier-infrastructure.test.mjs evaluation/candidate-verifier-setup.test.mjs evaluation/verify-verifier-infrastructure.test.mjs
        env:
          GRAPH_ENGINE_INFRASTRUCTURE_GUEST_TESTS: "1"

  sealed-public-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies with one bounded retry
        run: npm ci || { sleep 5; npm ci; }
      - run: npm run build:dependencies
      - name: Public-only Docker intake and local model relay
        run: |
          docker pull node:24-bookworm-slim@sha256:2c87ef9bd3c6a3bd4b472b4bec2ce9d16354b0c574f736c476489d09f560a203
          docker build --pull=false --network=none \
            -f evaluation/sealed/worker-runtime/Dockerfile \
            -t graph-sealed-public-intake:ci evaluation/sealed/worker-runtime
          GRAPH_SEALED_PUBLIC_INTAKE_NATIVE_TESTS=1 \
          GRAPH_SEALED_PUBLIC_INTAKE_IMAGE="$(docker image inspect --format '{{.Id}}' graph-sealed-public-intake:ci)" \
          GRAPH_SEALED_PUBLIC_DOCKER_ENDPOINT=unix:///var/run/docker.sock \
            node --test --test-concurrency=1 \
              evaluation/sealed/tests/worker-sandbox.test.mjs \
              evaluation/sealed/tests/local-worker.test.mjs

  sealed-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies with one bounded retry
        run: npm ci || { sleep 5; npm ci; }
      - run: npm run build:dependencies
      - name: Offline one-shot private digest oracle
        run: |
          docker pull node@sha256:40ad9f3064e67d6860b4bc3fe1880b2953934fd6320ada990e45fe0efa6badd7
          docker build --pull=false --network=none \
            -f evaluation/sealed/oracle-runtime/Dockerfile \
            -t graph-sealed-oracle:ci evaluation/sealed/oracle-runtime
          GRAPH_SEALED_ORACLE_NATIVE_TESTS=1 \
          GRAPH_SEALED_ORACLE_IMAGE="$(docker image inspect --format '{{.Id}}' graph-sealed-oracle:ci)" \
          GRAPH_SEALED_ORACLE_DOCKER_ENDPOINT=unix:///var/run/docker.sock \
            node --test --test-concurrency=1 evaluation/sealed/tests/oracle-runtime.test.mjs
      - name: Offline QuickJS engineering oracle
        run: |
          docker build --pull=false \
            -f evaluation/sealed/oracle-runtime/Dockerfile.engineering \
            -t graph-sealed-engineering:ci .
          GRAPH_SEALED_ENGINEERING_NATIVE_TESTS=1 \
          GRAPH_SEALED_ENGINEERING_IMAGE="$(docker image inspect --format '{{.Id}}' graph-sealed-engineering:ci)" \
          GRAPH_SEALED_ORACLE_DOCKER_ENDPOINT=unix:///var/run/docker.sock \
            node --test --test-concurrency=1 evaluation/sealed/tests/engineering-oracle.test.mjs
      - name: Offline QuickJS module-graph oracle
        run: |
          GRAPH_SEALED_MODULE_GRAPH_NATIVE_TESTS=1 \
          GRAPH_SEALED_MODULE_GRAPH_IMAGE="$(docker image inspect --format '{{.Id}}' graph-sealed-engineering:ci)" \
          GRAPH_SEALED_ORACLE_DOCKER_ENDPOINT=unix:///var/run/docker.sock \
            node --test --test-concurrency=1 evaluation/sealed/tests/module-graph-oracle.test.mjs
      - name: Offline bounded repository black-box oracle
        run: |
          npm run build -w @agile-graph/engine
          docker pull node:24-bookworm-slim@sha256:2c87ef9bd3c6a3bd4b472b4bec2ce9d16354b0c574f736c476489d09f560a203
          docker build --pull=false --network=none \
            -f evaluation/sealed/worker-runtime/Dockerfile \
            -t graph-sealed-public-intake:ci evaluation/sealed/worker-runtime
          docker build --pull=false --network=none \
            -f evaluation/sealed/oracle-runtime/Dockerfile.repository \
            -t graph-sealed-repository:ci .
          GRAPH_SEALED_REPOSITORY_NATIVE_TESTS=1 \
          GRAPH_SEALED_REPOSITORY_IMAGE="$(docker image inspect --format '{{.Id}}' graph-sealed-repository:ci)" \
          GRAPH_SEALED_PUBLIC_INTAKE_IMAGE="$(docker image inspect --format '{{.Id}}' graph-sealed-public-intake:ci)" \
          GRAPH_SEALED_ORACLE_DOCKER_ENDPOINT=unix:///var/run/docker.sock \
            node --test --test-concurrency=1 \
              evaluation/sealed/oracle-runtime/repository.test.mjs \
              evaluation/sealed/oracle-runtime/repository-host.test.mjs \
              evaluation/sealed/tests/repository-end-to-end.test.mjs \
              evaluation/sealed/tests/local-repository-attempt.test.mjs
      - name: Offline declared-tree repository black-box oracle
        run: |
          docker build --pull=false --network=none \
            -f evaluation/sealed/oracle-runtime/Dockerfile.repository-v2 \
            -t graph-sealed-repository-v2:ci .
          GRAPH_SEALED_REPOSITORY_V2_NATIVE_TESTS=1 \
          GRAPH_SEALED_REPOSITORY_V2_IMAGE="$(docker image inspect --format '{{.Id}}' graph-sealed-repository-v2:ci)" \
          GRAPH_SEALED_PUBLIC_INTAKE_IMAGE="$(docker image inspect --format '{{.Id}}' graph-sealed-public-intake:ci)" \
          GRAPH_SEALED_ORACLE_DOCKER_ENDPOINT=unix:///var/run/docker.sock \
            node --test --test-concurrency=1 \
              evaluation/sealed/oracle-runtime/repository-v2.test.mjs \
              evaluation/sealed/oracle-runtime/repository-host-v2.test.mjs \
              evaluation/sealed/tests/repository-scope-v2.test.mjs \
              evaluation/sealed/tests/local-repository-v2-attempt.test.mjs \
              evaluation/sealed/tests/collection-runner.test.mjs
