name: Dart binding preflight

on:
  push:
    branches: ["fix/dart-*"]
    paths:
      - ".github/workflows/dart-native.yml"
      - "packages/engine/src/context/dart*.ts"
      - "packages/engine/tests/context-dart-runtime.test.ts"
      - "packages/engine/tests/fixtures/dart-runtime/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dart-binding-${{ github.ref }}
  cancel-in-progress: true

# Focused native failure diagnosis, not a substitute for any protected check.
# The normal platform workflow still runs the complete Dart suite and all
# other required checks on the final PR head.
jobs:
  dart-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies with one bounded archive retry
        run: |
          # Match the required Linux job's native-archive installation policy.
          npm ci --ignore-scripts || { sleep 5; npm ci --ignore-scripts; }
          npm rebuild esbuild fsevents onnxruntime-node protobufjs || { sleep 5; npm rebuild esbuild fsevents onnxruntime-node protobufjs; }
      - run: npm run build:dependencies
      - name: Build the pinned offline analyzer image
        run: |
          docker pull dart@sha256:4027705fb598ee07b016e17a06786e56c399f95308a54f7171fcc60871eb1738
          docker buildx build --platform=linux/amd64 --load --pull=false --network=none -f packages/engine/tests/fixtures/dart-runtime/Dockerfile -t graph-dart-analyzer:local packages/engine/tests/fixtures/dart-runtime
          docker image inspect graph-dart-analyzer:local --format 'Dart image={{.Id}} os={{.Os}} arch={{.Architecture}} env={{json .Config.Env}} entrypoint={{json .Config.Entrypoint}} labels={{json .Config.Labels}}'
      - name: Direct and imported Dart binding regression
        run: npm test -w @agile-graph/engine -- --run tests/context-dart-runtime.test.ts -t 'binds a direct and imported top-level call with all Dart source provenance'
        env:
          GRAPH_ENGINE_DART_DOCKER_TESTS: "1"
