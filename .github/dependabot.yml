# npm version-update PRs are off (open-pull-requests-limit: 0): they change the
# hash-pinned package-lock.json, so their CI fails by design. Dependabot
# security updates for npm are unaffected. A maintainer story accepts npm
# updates monthly; see "Dependency audit and updates" in
# docs/security-scanning.md. GitHub Actions still gets weekly update PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
